name: workflow-automation-staging

services:
  db:
    env_file:
      - ../.env.staging

  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - ../.env.staging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

  api:
    image: ${API_IMAGE:?API_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - ../.env.staging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      EXECUTION_QUEUE_MODE: redis
      PORT: 3001
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:${STAGING_API_HOST_PORT:-3101}:3001"

  worker:
    image: ${API_IMAGE:?API_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - ../.env.staging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      EXECUTION_QUEUE_MODE: redis
      PROCESS_ROLE: worker

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    ports:
      - "127.0.0.1:${STAGING_WEB_HOST_PORT:-3100}:3000"

