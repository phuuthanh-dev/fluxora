name: workflow-automation-staging

services:
  db:
    env_file:
      - ../.env.staging

  migrate:
    image: workflow-automation-api:staging
    env_file:
      - ../.env.staging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

  api:
    image: workflow-automation-api:staging
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env.staging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      EXECUTION_QUEUE_MODE: redis
      PORT: 3001
      TRUST_PROXY: "true"

  worker:
    image: workflow-automation-api:staging
    env_file:
      - ../.env.staging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      EXECUTION_QUEUE_MODE: redis
      PROCESS_ROLE: worker

  web:
    image: workflow-automation-web:staging
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

