name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Main commits have separate groups, so a docs-only run cannot cancel an
# earlier product run. Superseded runs of the same PR are still cancelled.
concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine verification scope
    runs-on: ubuntu-latest
    outputs:
      run_verify: ${{ steps.scope.outputs.run_verify }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Detect product changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          head="$HEAD_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ || -z "$head" || "$base" == "$head" ]]; then
            echo "run_verify=true" >> "$GITHUB_OUTPUT"
            echo "Verification required: true (missing comparison revision)"
            exit 0
          fi
          # A force push or unavailable ancestry cannot safely use a short diff.
          if [[ "$EVENT_NAME" == "push" ]] && ! git merge-base --is-ancestor "$base" "$head"; then
            echo "run_verify=true" >> "$GITHUB_OUTPUT"
            echo "Verification required: true (non-fast-forward or unknown ancestry)"
            exit 0
          fi
          scope="$(node scripts/ci-change-scope.mjs "$base" "$head")"
          run_verify=false
          if [[ "$scope" == "product" ]]; then run_verify=true; fi
          echo "run_verify=$run_verify" >> "$GITHUB_OUTPUT"
          echo "Verification required: $run_verify"

  verify:
    needs: scope
    if: needs.scope.outputs.run_verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
          POSTGRES_DB: fluxora_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d fluxora_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://workflow:workflow@localhost:5432/fluxora_ci_test?schema=public
      REDIS_URL: redis://localhost:6379
      FLUXORA_GMAIL_INTEGRATION: "1"
      FLUXORA_ROLLBACK_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Generate CI test encryption key
        shell: bash
        run: |
          key="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64"))')"
          echo "::add-mask::$key"
          echo "APP_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - run: npm run db:deploy
      - run: npm run verify
