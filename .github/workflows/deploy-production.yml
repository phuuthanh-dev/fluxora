name: Deploy production

on:
  workflow_run:
    workflows: ["Quality gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character commit SHA to build and deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false
  # Do not let a later docs-only workflow replace a pending product deployment.
  queue: max

env:
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event.workflow_run.head_sha }}

jobs:
  qualify:
    name: Qualify automatic deployment
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.id == github.event.repository.id)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      # Policy comes from trusted main, not from an upstream PR or artifact.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'workflow_run'
        with:
          ref: main
          fetch-depth: 0
      - name: Require verified, non-stale product commit
        id: decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$UPSTREAM_RUN_ID" =~ ^[0-9]+$ || ! "$UPSTREAM_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "Missing upstream run metadata; refusing deployment." >&2; exit 1
          fi
          verification="$(gh api --paginate --slurp "repos/$REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/attempts/$UPSTREAM_ATTEMPT/jobs?per_page=100" | node scripts/ci-upstream-verification.mjs "$COMMIT_SHA" "$UPSTREAM_ATTEMPT")"
          if [[ "$verification" == "skipped" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only quality run; no deployment."
            exit 0
          fi
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          current="$(git rev-parse refs/remotes/origin/main)"
          if ! git merge-base --is-ancestor "$COMMIT_SHA" "$current"; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Verified commit is no longer an ancestor of main; no automatic deployment."
            exit 0
          fi
          scope="$(node scripts/ci-change-scope.mjs "$COMMIT_SHA" "$current")"
          if [[ "$scope" == "product" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Newer product changes exist; wait for their own quality gate."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push production images
    needs: qualify
    if: needs.qualify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.COMMIT_SHA }}
      - name: Validate immutable commit
        env:
          IMAGE_TAG: ${{ env.COMMIT_SHA }}
        run: |
          case "$IMAGE_TAG" in
            ''|*[!0-9a-f]*) echo "COMMIT_SHA must be a 40-character lowercase commit SHA"; exit 1 ;;
          esac
          test "${#IMAGE_TAG}" -eq 40 || { echo "COMMIT_SHA must be a 40-character lowercase commit SHA"; exit 1; }
          test "$(git rev-parse HEAD)" = "$IMAGE_TAG" || { echo "checked out commit does not match COMMIT_SHA"; exit 1; }
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Validate public API origin
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
        run: |
          case "$NEXT_PUBLIC_API_URL" in
            https://*/api/v1) ;;
            *) echo "NEXT_PUBLIC_API_URL must be an HTTPS API origin ending in /api/v1"; exit 1 ;;
          esac
      - name: Build and push API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAMESPACE }}/workflow-automation-api:${{ env.COMMIT_SHA }}
          cache-from: type=gha,scope=workflow-api
          cache-to: type=gha,mode=max,scope=workflow-api
      - name: Build and push Web image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          tags: ghcr.io/${{ env.IMAGE_NAMESPACE }}/workflow-automation-web:${{ env.COMMIT_SHA }}
          cache-from: type=gha,scope=workflow-web
          cache-to: type=gha,mode=max,scope=workflow-web

  deploy:
    name: Deploy production
    needs: build
    if: needs.build.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.COMMIT_SHA }}
      - name: Stage deployment bundle
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/docker-compose.production.yml,infra/scripts"
          target: "/opt/workflow-automation/.incoming/${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Deploy immutable image tag
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          IMAGE_TAG: ${{ env.COMMIT_SHA }}
          RELEASE_BUNDLE: /opt/workflow-automation/.incoming/${{ github.run_id }}-${{ github.run_attempt }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,RELEASE_BUNDLE,GHCR_PULL_USERNAME,GHCR_PULL_TOKEN
          script: |
            set -eu
            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              : "${GHCR_PULL_USERNAME:?GHCR_PULL_USERNAME is required when GHCR_PULL_TOKEN is configured}"
              printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io --username "$GHCR_PULL_USERNAME" --password-stdin
            fi
            chmod +x "$RELEASE_BUNDLE"/infra/scripts/*.sh
            IMAGE_TAG="$IMAGE_TAG" APP_DIR=/opt/workflow-automation RELEASE_BUNDLE="$RELEASE_BUNDLE" sh "$RELEASE_BUNDLE/infra/scripts/deploy.sh"

