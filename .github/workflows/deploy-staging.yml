name: Deploy staging

on:
  workflow_run:
    workflows: ["Quality gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character commit SHA to build and deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event.workflow_run.head_sha }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.COMMIT_SHA }}
      - name: Validate immutable commit
        run: |
          case "$COMMIT_SHA" in
            ''|*[!0-9a-f]*) echo "COMMIT_SHA must be a 40-character lowercase commit SHA"; exit 1 ;;
          esac
          test "${#COMMIT_SHA}" -eq 40 || { echo "COMMIT_SHA must be a 40-character lowercase commit SHA"; exit 1; }
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA" || { echo "checked out commit does not match COMMIT_SHA"; exit 1; }
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Validate staging API origin
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_URL || 'http://103.140.249.73/api/v1' }}
        run: |
          case "$NEXT_PUBLIC_API_URL" in
            http://*/api/v1|https://*/api/v1) ;;
            *) echo "STAGING_NEXT_PUBLIC_API_URL must end in /api/v1"; exit 1 ;;
          esac
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAMESPACE }}/workflow-automation-api:${{ env.COMMIT_SHA }}
          cache-from: type=gha,scope=workflow-api
          cache-to: type=gha,mode=max,scope=workflow-api
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: NEXT_PUBLIC_API_URL=${{ vars.STAGING_NEXT_PUBLIC_API_URL || 'http://103.140.249.73/api/v1' }}
          tags: ghcr.io/${{ env.IMAGE_NAMESPACE }}/workflow-automation-web:${{ env.COMMIT_SHA }}
          cache-from: type=gha,scope=workflow-web
          cache-to: type=gha,mode=max,scope=workflow-web

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.COMMIT_SHA }}
      - name: Copy staging deployment files
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be946e8 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/docker-compose.production.yml,infra/docker-compose.staging.yml,infra/scripts"
          target: "/opt/workflow-automation"
      - name: Deploy immutable staging image
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          IMAGE_TAG: ${{ env.COMMIT_SHA }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_PULL_USERNAME,GHCR_PULL_TOKEN
          script: |
            set -eu
            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              : "${GHCR_PULL_USERNAME:?GHCR_PULL_USERNAME is required when GHCR_PULL_TOKEN is configured}"
              printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io --username "$GHCR_PULL_USERNAME" --password-stdin
            fi
            chmod +x /opt/workflow-automation/infra/scripts/*.sh
            IMAGE_TAG="$IMAGE_TAG" APP_DIR=/opt/workflow-automation /opt/workflow-automation/infra/scripts/deploy-staging.sh
