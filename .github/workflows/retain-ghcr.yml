name: Retain GHCR application images

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report deletions without removing package versions"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [api, web]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_OWNER: ${{ github.repository_owner }}
      GHCR_PACKAGE_NAME: workflow-automation-${{ matrix.package }}
      GHCR_KEEP_VERSIONS: "5"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prune old immutable versions
        run: infra/scripts/prune-ghcr-versions.sh
